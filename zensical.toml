  ] },
  { "Гайды читателям" = [
    { "О материалах" = "guides/README.md" },
    { "О боте" = "guides/o-bote.md" },
    { "Заявить интерес" = "guides/zgloszenie-zainteresowania.md" },
    { "Консультации" = "guides/konsultacje-publiczne.md" },

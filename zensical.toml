[project.theme]
language = "ru"
custom_dir = "docs-theme"
font = false
features = ["navigation.top", "content.code.copy"]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.markdown_extensions.toc]
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }

    { "Концепция" = "plans/website-design-concept.md" },
  ] },
  { "Планы" = [
    { "Обзор" = "plans/index.md" },
    { "Roadmap" = "roadmap.md" },
    { "Сокращение дублирования" = "plans/2026-09-25-deduplication.md" },
    { "Вторичные batch-вызовы" = "plans/2026-09-23-batch-secondary-calls.md" },
    { "Локальная документация" = "plans/2026-09-24-local-documentation.md" },
    { "Монетизация" = "plans/monetization-options.md" },
    { "История плана сайта" = "plans/website-development-plan.md" },
  ] },
  { "Аудиты" = [
    { "Обзор" = "reviews/index.md" },
    { "Дублирование кода · 25.09" = "reviews/2026-09-25-duplication.md" },
    { "Инцидент 2111" = "incident-2111.md" },
    { "Batch: архитектура · 23.09" = "reviews/2026-09-23-batch-architecture.md" },

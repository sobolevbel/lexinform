# Weekly live checks against api.sejm.gov.pl, orka.sejm.gov.pl and the register on gov.pl.
# Not legislacja.rcl.gov.pl: a GitHub-hosted runner cannot open a connection to it.
name: Integration (live external systems)

on:
  schedule:
    - cron: "0 4 * * 1"  # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -m integration -q
      - name: Tell the log channel when something changed under us
        if: failure() && env.LEXINFORM_TELEGRAM_LOG_CHANNEL_ID != ''
        env:
          LEXINFORM_TELEGRAM_BOT_TOKEN: ${{ secrets.LEXINFORM_TELEGRAM_BOT_TOKEN }}
          LEXINFORM_TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_LOG_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -o /dev/null -X POST \
            "https://api.telegram.org/bot${LEXINFORM_TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${LEXINFORM_TELEGRAM_LOG_CHANNEL_ID}" \
            --data-urlencode "text=❌ lexinform: live external-system checks failed: ${RUN_URL}"

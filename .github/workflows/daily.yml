# Daily job: discover, analyse, publish, track; state lives in the "state" branch.
name: Daily run

on:
  schedule:
    # Three times a day: prints and agendas appear during Warsaw working hours, and a reader
    # who wants to act on a consultation deadline should not wait until tomorrow morning.
    # Off the full hour on purpose: GitHub queues ":00" crons behind everyone else's (the 05:00
    # run of 2026-09-08 started at 09:25); odd minutes are picked up far sooner.
    - cron: "23 4 * * *"   # 06:23 Warsaw (summer time)
    - cron: "23 10 * * *"  # 12:23
    - cron: "23 16 * * *"  # 18:23
  workflow_dispatch:
    inputs:
      since:
        description: "Only bills modified since (YYYY-MM-DD). Leave empty for the automatic watermark."
        required: false
        default: ""
      dry_run:
        description: "Dry run: print messages, do not post, do not persist"
        type: boolean
        default: false
      reprefilter_limit:
        description: "Before the run, scan the texts of up to N bills the title prefilter skipped (0 = off)"
        required: false
        default: "0"

# One run at a time so two runs never race on the state branch.
concurrency:
  group: lexinform-daily
  cancel-in-progress: false

permissions:
  contents: write  # needed to push the state branch with the automatic GITHUB_TOKEN

env:
  STATE_BRANCH: state
  STATE_FILE: state/lexinform.sql
  LEXINFORM_DB_PATH: ${{ github.workspace }}/lexinform.db

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out state branch (create it if missing)
        id: state
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch origin "$STATE_BRANCH"
            git worktree add state "origin/$STATE_BRANCH"
            git -C state checkout -B "$STATE_BRANCH"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git worktree add --detach state
            git -C state checkout --orphan "$STATE_BRANCH"
            git -C state rm -rf --quiet . || true
            echo "# lexinform state branch: SQLite dump written by the daily workflow" > state/README.md
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev

      # A missing dump is tolerated only on the run that created the branch: afterwards it means
      # the state was lost, and an empty database would re-post every card of the channel.
      - name: Restore database from state branch
        id: restore
        env:
          MISSING_OK: ${{ steps.state.outputs.created == 'true' && '--missing-ok' || '' }}
        run: uv run --frozen --no-dev lexinform db restore "$STATE_FILE" $MISSING_OK

      # Backfill: bills skipped by title before the text prefilter existed (or while a file type
      # was unreadable) get their text scanned; the run below analyses and posts the hits.
      - name: Re-run the text prefilter on skipped bills
        if: ${{ inputs.reprefilter_limit != '' && inputs.reprefilter_limit != '0' }}
        env:
          LEXINFORM_RCL_PROXY_URL: ${{ secrets.LEXINFORM_RCL_PROXY_URL }}
          LEXINFORM_LOG_LEVEL: INFO
        run: uv run --frozen --no-dev lexinform reprefilter --limit "${{ inputs.reprefilter_limit }}"

      # The run exits 1 when it had errors, but whatever it did publish is recorded in the
      # database, so the state must be saved anyway (otherwise the next run would post duplicates).
      - name: Run lexinform
        id: run
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEXINFORM_TELEGRAM_BOT_TOKEN: ${{ secrets.LEXINFORM_TELEGRAM_BOT_TOKEN }}
          LEXINFORM_TELEGRAM_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_CHANNEL_ID }}
          LEXINFORM_TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_LOG_CHANNEL_ID }}
          # legislacja.rcl.gov.pl drops connections from GitHub's runners: go through an EU proxy.
          LEXINFORM_RCL_PROXY_URL: ${{ secrets.LEXINFORM_RCL_PROXY_URL }}
          LEXINFORM_LOG_LEVEL: INFO
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$INPUT_SINCE" ]; then ARGS+=(--since "$INPUT_SINCE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          uv run --frozen --no-dev lexinform run "${ARGS[@]}"

      # Runs even when the run step was cancelled by the job timeout: whatever was posted is in the
      # database and must be saved, otherwise the next run would post it again.
      - name: Dump database and push state branch
        id: dump
        if: ${{ always() && inputs.dry_run != true && steps.restore.outcome == 'success' && steps.run.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          git -C state config user.name "github-actions[bot]"
          git -C state config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Someone may have pushed to the branch meanwhile (e.g. a manual dump). The branch holds
          # one file, so a rebase would always conflict: the dump is written again on top of the
          # fetched tip instead (this run's database is the newer state either way).
          for attempt in 1 2 3; do
            uv run --frozen --no-dev lexinform db dump "$STATE_FILE"
            git -C state add -A
            if git -C state diff --cached --quiet; then
              echo "state unchanged"; exit 0
            fi
            git -C state commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -C state push origin "HEAD:$STATE_BRANCH"; then exit 0; fi
            echo "push rejected, fetching the branch again (attempt $attempt)"
            git -C state fetch origin "$STATE_BRANCH"
            git -C state reset --hard "origin/$STATE_BRANCH"
          done
          exit 1

      # The run itself reports to the log channel; this covers everything around it (a failed
      # restore, dump or push, a broken checkout), the cases where state may be lost.
      - name: Tell the log channel when the job failed around the run
        if: ${{ failure() }}
        env:
          LEXINFORM_TELEGRAM_BOT_TOKEN: ${{ secrets.LEXINFORM_TELEGRAM_BOT_TOKEN }}
          LEXINFORM_TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_LOG_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESTORE: ${{ steps.restore.outcome }}
          DUMP: ${{ steps.dump.outcome }}
        run: |
          [ -n "$LEXINFORM_TELEGRAM_LOG_CHANNEL_ID" ] || exit 0
          curl -sS -o /dev/null -X POST \
            "https://api.telegram.org/bot${LEXINFORM_TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${LEXINFORM_TELEGRAM_LOG_CHANNEL_ID}" \
            --data-urlencode "text=❌ lexinform: daily job failed around the run (restore: ${RESTORE}, dump/push: ${DUMP}); the state may be unsaved: ${RUN_URL}" \
            || true

      - name: Fail the job if the run reported errors
        if: ${{ steps.run.outcome == 'failure' }}
        run: |
          echo "lexinform run finished with errors (see the run report / log channel)"
          exit 1

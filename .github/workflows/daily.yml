# Daily job: discover, analyse, publish, track; state lives in the "state" branch.
name: Daily run

on:
  schedule:
    # Three times a day: prints and agendas appear during Warsaw working hours, and a reader
    # who wants to act on a consultation deadline should not wait until tomorrow morning.
    # GitHub may delay scheduled runs by up to an hour.
    - cron: "0 5 * * *"   # 07:00 Warsaw (summer time)
    - cron: "0 11 * * *"  # 13:00
    - cron: "0 17 * * *"  # 19:00
  workflow_dispatch:
    inputs:
      since:
        description: "Only bills modified since (YYYY-MM-DD). Leave empty for the automatic watermark."
        required: false
        default: ""
      dry_run:
        description: "Dry run: print messages, do not post, do not persist"
        type: boolean
        default: false

# One run at a time so two runs never race on the state branch.
concurrency:
  group: lexinform-daily
  cancel-in-progress: false

permissions:
  contents: write  # needed to push the state branch with the automatic GITHUB_TOKEN

env:
  STATE_BRANCH: state
  STATE_FILE: state/lexinform.sql
  LEXINFORM_DB_PATH: ${{ github.workspace }}/lexinform.db

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out state branch (create it if missing)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch origin "$STATE_BRANCH"
            git worktree add state "origin/$STATE_BRANCH"
            git -C state checkout -B "$STATE_BRANCH"
          else
            git worktree add --detach state
            git -C state checkout --orphan "$STATE_BRANCH"
            git -C state rm -rf --quiet . || true
            echo "# lexinform state branch: SQLite dump written by the daily workflow" > state/README.md
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev

      - name: Restore database from state branch
        id: restore
        run: uv run --frozen --no-dev lexinform db restore "$STATE_FILE" --missing-ok

      # The run exits 1 when it had errors, but whatever it did publish is recorded in the
      # database, so the state must be saved anyway (otherwise the next run would post duplicates).
      - name: Run lexinform
        id: run
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LEXINFORM_TELEGRAM_BOT_TOKEN: ${{ secrets.LEXINFORM_TELEGRAM_BOT_TOKEN }}
          LEXINFORM_TELEGRAM_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_CHANNEL_ID }}
          LEXINFORM_TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_LOG_CHANNEL_ID }}
          LEXINFORM_LOG_LEVEL: INFO
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$INPUT_SINCE" ]; then ARGS+=(--since "$INPUT_SINCE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          uv run --frozen --no-dev lexinform run "${ARGS[@]}"

      # Runs even when the run step was cancelled by the job timeout: whatever was posted is in the
      # database and must be saved, otherwise the next run would post it again.
      - name: Dump database and push state branch
        if: ${{ always() && inputs.dry_run != true && steps.restore.outcome == 'success' && steps.run.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev lexinform db dump "$STATE_FILE"
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "state unchanged"; exit 0
          fi
          git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Someone may have pushed to the branch meanwhile (e.g. a manual dump): rebase and retry.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$STATE_BRANCH"; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git fetch origin "$STATE_BRANCH"
            git rebase "origin/$STATE_BRANCH" || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Fail the job if the run reported errors
        if: ${{ steps.run.outcome == 'failure' }}
        run: |
          echo "lexinform run finished with errors (see the run report / log channel)"
          exit 1

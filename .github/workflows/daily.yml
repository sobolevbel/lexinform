# Daily job: discover, analyse, publish, track; state lives in the "state" branch.
# Also the executor of operator commands: the relay on the VPS files one JSON per command into
# the "inbox" branch and sends a repository_dispatch, which runs the commands phase alone
# (docs/operator-commands.md).
name: Daily run

on:
  schedule:
    # Twice a day on weekdays, once at midday on the weekend. The Sejm, the Senate, the
    # ministries and RCL publish during Warsaw working hours, Monday to Friday.
    #   morning (07:23 Warsaw in summer, 06:23 in winter): the previous evening's votes, agendas
    #     and late prints reach the reader before the working day, when a consultation deadline
    #     or a hearing still leaves the day to act;
    #   evening (18:23 Warsaw in summer, 17:23 in winter): the day's referrals, reports, Dz.U.
    #     publications and tomorrow's committee agendas, after the offices have posted them and
    #     before the reader's evening;
    #   weekend midday (12:23 Warsaw in summer, 11:23 in winter): the offices post nothing, but
    #     the calendar moves on: consultation deadlines and in-force dates falling on a Saturday
    #     or Sunday, reminders of Monday's hearings, a late Friday upload on RCL.
    # Nothing is skipped by a gap: the discovery watermark is the previous run's start.
    # GitHub runs schedules late in this repository whatever the minute: over 13–30 Sept 2026
    # 05:23 started at 09:53–11:48, 16:23 at 19:03–22:07 and the weekend's 10:23 at 13:56–15:11,
    # so the cron times sit ~5 hours before the hour a run is wanted. A changed schedule may skip
    # its first occurrence (2026-09-08 17:00, 2026-09-10 05:23). Off the full hour anyway: ":00" is
    # the most crowded minute of the queue.
    - cron: "23 1 * * 1-5"   # starts ~06:00–07:50 UTC, 08:00–09:50 Warsaw (summer time)
    - cron: "23 13 * * 1-5"  # starts ~16:00–19:00 UTC
    - cron: "23 6 * * 0,6"   # starts ~10:00–11:00 UTC, Saturday and Sunday
    # Delivery-only ticks share the state lock; GitHub may start them late too.
    - cron: "43 * * * *"
  repository_dispatch:
    # The relay files a command into the inbox branch and then sends `inbox`, which starts a run
    # within seconds (only cron is delayed); the mikrus batch poller sends `batch-ready` the same
    # way once a submitted batch is done. A push of the inbox branch itself would start nothing:
    # GitHub reads a push event's workflow from the pushed branch, which has none.
    types: [inbox, batch-ready]
  workflow_dispatch:
    inputs:
      log_message_id:
        description: "Relay acknowledgement to delete once the report is posted"
        required: false
        default: ""
      command:
        description: "Which lexinform command this run is. `run` is the whole day; the others are one phase of it."
        type: choice
        options: [run, scan, track, collect-batches, drain-deliveries, reprefilter, index-rcl-numbers]
        default: run
      options:
        description: "Its own flags, exactly as the CLI takes them (--no-publish --min-score 4). The relay checks every value before it sends one."
        required: false
        default: ""
      since:
        description: "Only bills modified since (YYYY-MM-DD). Leave empty for the automatic watermark."
        required: false
        default: ""
      dry_run:
        description: "Dry run: print messages, do not post, do not persist"
        type: boolean
        default: false
      reprefilter_limit:
        description: "Before the run, scan the texts of up to N bills the title prefilter skipped (0 = off)"
        required: false
        default: "0"
      reprefilter_text_skipped:
        description: "Let that scan also revisit bills already rejected by their text (a skip nothing else ever reopens)"
        type: boolean
        default: false
      index_rcl_since:
        description: "Before the run, read the RCL listing back to this date (YYYY-MM-DD) and write down which project carries which wykaz number. Listing pages only, no tokens."
        required: false
        default: ""

permissions:
  contents: write  # needed to push the state and inbox branches with the automatic GITHUB_TOKEN

env:
  STATE_BRANCH: state
  STATE_FILE: state/lexinform.sql
  INBOX_BRANCH: inbox
  LEXINFORM_DB_PATH: ${{ github.workspace }}/lexinform.db
  LEXINFORM_INBOX_DIR: ${{ github.workspace }}/inbox/inbox
  LEXINFORM_RUN_MESSAGE_ID: ${{ inputs.log_message_id }}
  LEXINFORM_READER_ATTENTION: ${{ vars.LEXINFORM_READER_ATTENTION || 'shadow' }}
  LEXINFORM_ATTENTION_ROUNDUP: ${{ vars.LEXINFORM_ATTENTION_ROUNDUP || 'run' }}
  LEXINFORM_ATTENTION_DAILY_HOUR: ${{ vars.LEXINFORM_ATTENTION_DAILY_HOUR || '18' }}
  # The monthly digest's ask for support; unset, the digest asks nothing.
  LEXINFORM_DIGEST_SUPPORT_URL: ${{ vars.LEXINFORM_DIGEST_SUPPORT_URL }}
  LEXINFORM_DIGEST_SPONSOR_URL: ${{ vars.LEXINFORM_DIGEST_SPONSOR_URL }}

jobs:
  run:
    if: ${{ github.event_name != 'schedule' || github.event.schedule != '43 * * * *' || (vars.LEXINFORM_READER_ATTENTION == 'on' && vars.LEXINFORM_ATTENTION_ROUNDUP == 'daily') }}
    # Disabled ticks never acquire the state lock; enabled ticks cannot replace pending work.
    concurrency:
      group: lexinform-daily
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check out state branch (create it if missing)
        id: state
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null; then
            git fetch origin "$STATE_BRANCH"
            git worktree add state "origin/$STATE_BRANCH"
            git -C state checkout -B "$STATE_BRANCH"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git worktree add --detach state
            git -C state checkout --orphan "$STATE_BRANCH"
            git -C state rm -rf --quiet . || true
            echo "# lexinform state branch: SQLite dump written by the daily workflow" > state/README.md
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      # The operator commands the relay filed (docs/operator-commands.md). No branch yet: no
      # commands phase, and nothing to commit afterwards.
      - name: Check out inbox branch (if it exists)
        id: inbox
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$INBOX_BRANCH" >/dev/null; then
            git fetch origin "$INBOX_BRANCH"
            git worktree add inbox "origin/$INBOX_BRANCH"
            git -C inbox checkout -B "$INBOX_BRANCH"
            mkdir -p inbox/inbox
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "inbox: $(ls inbox/inbox | wc -l) command file(s)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "no inbox branch: operator commands are off"
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev

      # A missing dump is tolerated only on the run that created the branch: afterwards it means
      # the state was lost, and an empty database would re-post every card of the channel.
      - name: Restore database from state branch
        id: restore
        env:
          MISSING_OK: ${{ steps.state.outputs.created == 'true' && '--missing-ok' || '' }}
        run: uv run --frozen --no-dev lexinform db restore "$STATE_FILE" $MISSING_OK

      # The run exits 1 when it had errors, but whatever it did publish is recorded in the
      # database, so the state must be saved anyway (otherwise the next run would post duplicates).
      # The relay's event runs the commands phase alone; the schedule and the button run the
      # whole day (which answers the waiting commands first).
      - name: Run lexinform
        id: run
        # Leave time for state persistence before the job-wide timeout.
        timeout-minutes: 35
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LEXINFORM_TELEGRAM_BOT_TOKEN: ${{ secrets.LEXINFORM_TELEGRAM_BOT_TOKEN }}
          LEXINFORM_TELEGRAM_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_CHANNEL_ID }}
          LEXINFORM_TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_LOG_CHANNEL_ID }}
          # legislacja.rcl.gov.pl drops connections from GitHub's runners: go through an EU proxy.
          LEXINFORM_RCL_PROXY_URL: ${{ secrets.LEXINFORM_RCL_PROXY_URL }}
          LEXINFORM_LOG_LEVEL: INFO
          # Review purposes are opt-in; every supported model call but triage uses batch.
          LEXINFORM_LLM_BATCH_ENABLED: "true"
          LEXINFORM_LLM_BATCH_KINDS: ${{ vars.LEXINFORM_LLM_BATCH_KINDS || 'analysis,reanalysis,joint,supplement,amendments' }}
          LEXINFORM_COMMISSION_REVIEWS_ENABLED: ${{ vars.LEXINFORM_COMMISSION_REVIEWS_ENABLED || 'false' }}
          LEXINFORM_CONSULTATION_REVIEWS_ENABLED: ${{ vars.LEXINFORM_CONSULTATION_REVIEWS_ENABLED || 'false' }}
          LEXINFORM_LLM_BATCH_STATE_FILE: state/lexinform.sql
          LEXINFORM_LLM_BATCH_STATE_BRANCH: state
          LEXINFORM_STATE_CHECKPOINT_REQUIRED: "true"
          INPUT_SINCE: ${{ inputs.since }}
          INPUT_INDEX_RCL_SINCE: ${{ inputs.index_rcl_since }}
          INPUT_REPREFILTER_LIMIT: ${{ inputs.reprefilter_limit }}
          INPUT_REPREFILTER_TEXT_SKIPPED: ${{ inputs.reprefilter_text_skipped }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          # Through the environment and never interpolated into the script: the Actions tab lets
          # a human type anything here, and `${{ }}` in a `run:` block is that text becoming code.
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_OPTIONS: ${{ inputs.options }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TYPE: ${{ github.event.action }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INBOX_PRESENT: ${{ steps.inbox.outputs.present }}
        run: |
          set -euo pipefail
          if [ "$INBOX_PRESENT" != "true" ]; then unset LEXINFORM_INBOX_DIR; fi
          if [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "43 * * * *" ]; then
            STATUS=0
            uv run --frozen --no-dev lexinform drain-deliveries || STATUS=$?
            if [ "$STATUS" = "75" ]; then exit "$STATUS"; fi
            if [ "$INBOX_PRESENT" = "true" ] && compgen -G "$LEXINFORM_INBOX_DIR/*.json" >/dev/null; then
              uv run --frozen --no-dev lexinform commands || STATUS=$?
            fi
            exit "$STATUS"
          fi
          # Backfill shares the bounded Run step so its partial progress reaches final persistence.
          if [ -n "${INPUT_REPREFILTER_LIMIT:-}" ] && [ "$INPUT_REPREFILTER_LIMIT" != "0" ]; then
            PREFILTER_ARGS=(--limit "$INPUT_REPREFILTER_LIMIT")
            if [ "${INPUT_REPREFILTER_TEXT_SKIPPED:-}" = "true" ]; then
              PREFILTER_ARGS+=(--include-text-skipped)
            fi
            uv run --frozen --no-dev lexinform reprefilter "${PREFILTER_ARGS[@]}"
          fi
          # The join between a plan of the wykaz and its project on RCL is published in the
          # listing and nowhere else, so the years before this bot have to be read once.
          if [ -n "${INPUT_INDEX_RCL_SINCE:-}" ]; then
            uv run --frozen --no-dev lexinform index-rcl-numbers --since "$INPUT_INDEX_RCL_SINCE"
          fi
          if [ "$EVENT_NAME" = "repository_dispatch" ] && [ "$EVENT_TYPE" = "batch-ready" ]; then
            uv run --frozen --no-dev lexinform collect-batches
            exit 0
          fi
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            uv run --frozen --no-dev lexinform commands
            exit 0
          fi
          # The relay names one phase of a run the way the operator asked for it (/scan, /track,
          # /collect-batches, /reprefilter, /index-rcl-numbers); the schedule and the button name
          # nothing and get the whole day. `$INPUT_OPTIONS` splits into words: it is a flag list.
          COMMAND="${INPUT_COMMAND:-run}"
          ARGS=()
          if [ -n "${INPUT_OPTIONS:-}" ]; then ARGS+=($INPUT_OPTIONS); fi
          if [ "$COMMAND" = "run" ] && [ -n "$INPUT_SINCE" ]; then ARGS+=(--since "$INPUT_SINCE"); fi
          # These commands take a dry run, and it is the same input that keeps the state branch
          # unpushed, so none of them can ever disagree with it about what this run persisted.
          if [ "$INPUT_DRY_RUN" = "true" ] \
            && { [ "$COMMAND" = "run" ] || [ "$COMMAND" = "track" ] \
              || [ "$COMMAND" = "collect-batches" ] || [ "$COMMAND" = "drain-deliveries" ]; }; then
            ARGS+=(--dry-run)
          fi
          STATUS=0
          uv run --frozen --no-dev lexinform "$COMMAND" ${ARGS[@]+"${ARGS[@]}"} || STATUS=$?
          if [ "$STATUS" = "75" ]; then exit "$STATUS"; fi
          # scan/reprefilter/index-rcl-numbers have no commands phase: drain it, even after a failure.
          if [ "$INBOX_PRESENT" = "true" ] && [ "$INPUT_DRY_RUN" != "true" ] \
            && [ "$COMMAND" != "run" ] && [ "$COMMAND" != "track" ] \
            && [ "$COMMAND" != "collect-batches" ]; then
            uv run --frozen --no-dev lexinform commands || STATUS=$?
          fi
          exit "$STATUS"

      # Runs even when the run step was cancelled by the job timeout: whatever was posted is in the
      # database and must be saved, otherwise the next run would post it again.
      - name: Dump database and push state branch
        id: dump
        if: ${{ always() && inputs.dry_run != true && steps.restore.outcome == 'success' && steps.run.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          uv run --frozen --no-dev lexinform db checkpoint "$STATE_FILE" --branch "$STATE_BRANCH"

      # The run deleted the command files it answered; commit the deletions. The relay only adds
      # files and the run only removes them, so a rebase onto a moved branch never conflicts.
      - name: Commit handled commands and push inbox branch
        if: ${{ always() && inputs.dry_run != true && steps.inbox.outputs.present == 'true' && steps.run.outcome != 'skipped' && steps.dump.outcome == 'success' }}
        run: |
          set -euo pipefail
          git -C inbox config user.name "github-actions[bot]"
          git -C inbox config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C inbox add -A
          if git -C inbox diff --cached --quiet; then
            echo "inbox unchanged"; exit 0
          fi
          git -C inbox commit -m "inbox: handled $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git -C inbox push origin "HEAD:$INBOX_BRANCH"; then exit 0; fi
            echo "push rejected, rebasing onto the branch (attempt $attempt)"
            git -C inbox fetch origin "$INBOX_BRANCH"
            git -C inbox rebase "origin/$INBOX_BRANCH"
          done
          exit 1

      # A failed pipeline can still save state through the always() dump step.
      - name: Tell the log channel when the job failed around the run
        if: ${{ !cancelled() && (failure() || steps.run.outcome == 'failure') }}
        env:
          LEXINFORM_TELEGRAM_BOT_TOKEN: ${{ secrets.LEXINFORM_TELEGRAM_BOT_TOKEN }}
          LEXINFORM_TELEGRAM_LOG_CHANNEL_ID: ${{ secrets.LEXINFORM_TELEGRAM_LOG_CHANNEL_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN: ${{ steps.run.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          DUMP: ${{ steps.dump.outcome }}
        run: |
          [ -n "$LEXINFORM_TELEGRAM_LOG_CHANNEL_ID" ] || exit 0
          case "$DUMP" in
            success) state_status="state saved successfully" ;;
            failure) state_status="state save failed; the state may be unsaved" ;;
            skipped) state_status="state save skipped; the state may be unsaved" ;;
            *) state_status="state save outcome unavailable; the state may be unsaved" ;;
          esac
          curl --connect-timeout 10 --max-time 30 -fsS -o /dev/null -X POST \
            "https://api.telegram.org/bot${LEXINFORM_TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${LEXINFORM_TELEGRAM_LOG_CHANNEL_ID}" \
            --data-urlencode "text=❌ lexinform: daily job failed (run: ${RUN}, restore: ${RESTORE}, dump/push: ${DUMP}); ${state_status}: ${RUN_URL}" \
            || true
          # A new message notifies the operator; the relay's "run started" is then removed.
          [ -n "$LEXINFORM_RUN_MESSAGE_ID" ] || exit 0
          curl --connect-timeout 10 --max-time 30 -fsS -o /dev/null -X POST \
            "https://api.telegram.org/bot${LEXINFORM_TELEGRAM_BOT_TOKEN}/deleteMessage" \
            --data-urlencode "chat_id=${LEXINFORM_TELEGRAM_LOG_CHANNEL_ID}" \
            --data-urlencode "message_id=${LEXINFORM_RUN_MESSAGE_ID}" \
            || true

      - name: Fail the job if the run reported errors
        if: ${{ steps.run.outcome == 'failure' }}
        run: |
          echo "lexinform run finished with errors (see the run report / log channel)"
          exit 1

# Diagnostic, run by hand: can a GitHub runner reach www.gov.pl, where the wykaz prac
# legislacyjnych RM is published as one CSV? legislacja.rcl.gov.pl drops the SYN from these
# runners (see rcl-probe.yml); www.gov.pl is a single Polish address too (185.32.48.49, no CDN),
# so it has the same shape and has to be measured before the source is wired in.
name: Wykaz probe

on:
  workflow_dispatch:
    inputs:
      probe_run_id:
        description: Diagnostic run ID to retry
        required: false
        default: ""

permissions: {}

jobs:
  run:
    if: ${{ inputs.probe_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mark Sejm recovery safe
        run: echo "Synthetic marker for the diagnostics branch"
      - name: Fail the first diagnostic attempt
        if: ${{ github.run_attempt == 1 }}
        run: exit 1

  retry-probe:
    if: ${{ inputs.probe_run_id != '' }}
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Retry diagnostic job with the workflow token
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.probe_run_id }}
        run: |
          set -euo pipefail
          completed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/1/jobs" \
            --jq 'any(.jobs[] | select(.name == "run") | .steps[]; .name == "Mark Sejm recovery safe" and .conclusion == "success")')
          [ "$completed" = "true" ]
          gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed

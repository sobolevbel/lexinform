services:
  db:
    container_name: lexinform-db
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: lexinform_web
      POSTGRES_PASSWORD: lexinform_web
      POSTGRES_USER: lexinform_web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexinform_web -d lexinform_web"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lexinform-web-postgres:/var/lib/postgresql/data

volumes:
  lexinform-web-postgres:

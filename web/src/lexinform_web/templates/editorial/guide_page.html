{% extends "base.html" %}
{% load wagtailcore_tags %}
{% block title %}{{ page.title }} · lexinform{% endblock %}
{% block content %}
  <article class="reading" lang="{{ page.locale.language_code }}">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lead">{{ page.summary }}</p>{% endif %}
    {% include_block page.body %}
  </article>
{% endblock %}

[project]
name = "lexinform"
version = "0.1.0"
description = "Daily bot that tracks Polish Sejm bills affecting foreigners and posts LLM summaries to a Telegram channel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Yauheni Sobaleu" }]
keywords = ["sejm", "poland", "legislation", "foreigners", "telegram", "bot", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Russian",
  "Natural Language :: Polish",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "anthropic>=1.4,<2",
  "httpx2>=2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf>=5,<7",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/eugeneskycash/lexinform"
Issues = "https://github.com/eugeneskycash/lexinform/issues"

[project.scripts]
lexinform = "lexinform.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexinform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["B008"]  # typer.Option in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806", "E501"]
"src/lexinform/adapters/llm_prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration and not llm' -q"
markers = [
  "integration: tests that call the live Sejm API (network)",
  "llm: tests that call the real LLM API (costs money)",
]

[tool.coverage.run]
source = ["lexinform"]
branch = true

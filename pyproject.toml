[project]
name = "lexinform"
version = "0.1.0"
description = "Daily bot that tracks Polish Sejm bills affecting foreigners and posts LLM summaries to a Telegram channel"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Yauheni Sobaleu" }]
keywords = ["sejm", "poland", "legislation", "foreigners", "telegram", "bot", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Russian",
  "Natural Language :: Polish",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "anthropic>=1.4,<3",
  "beautifulsoup4>=4.13,<5",
  "httpx2>=2,<3",
  "inflate64>=1.0.4,<2",
  "olefile>=0.47,<1",
  "openai>=3.17.0",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.3,<3",
  "pypdf[fonts]>=5,<7",
  "tiktoken>=0.14.0",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/sobolevbel/lexinform"
Issues = "https://github.com/sobolevbel/lexinform/issues"

[project.scripts]
lexinform = "lexinform.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.168.0",
  "pytest-xdist>=3.8,<4",
]
docs = [
  "zensical>=0.0.64,<0.1",
]
mutation = [
  "mutmut==3.8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["web"]

[tool.hatch.build.targets.wheel]
packages = ["src/lexinform"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "web/src", "web/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]
ignore = ["B008"]  # typer.Option in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806", "E501"]
"src/lexinform/adapters/llm_prompts.py" = ["E501"]

[tool.mypy]
mypy_path = "typings"
python_version = "3.14"
strict = true
files = [
  "src",
  "tests",
  "tools/source_history_doctor.py",
  "tools/document_read_profile.py",
  "tools/measure_referenced_files.py",
  "tools/artifact_metadata.py",
  "tools/content_history_doctor.py",
  "tools/corpus_artifacts.py",
  "tools/corpus_runtime.py",
  "tools/corpus_runs.py",
  "tools/work_doctor.py",
  "tools/corpus_manifests.py",
  "tools/replay_odt_blocks.py",
  "tools/replay_pdf_pages.py",
  "tools/replay_word_blocks.py",
]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pypdf.*", "olefile"]  # ship no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --maxprocesses=4 --dist=worksteal -m 'not integration and not local_http' -q"
markers = [
  "integration: tests that call a live external system (network)",
  "local_http: tests that start a local HTTP server (run on demand)",
]

[tool.coverage.run]
source = ["lexinform"]
branch = true

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
  "src/lexinform/delivery_schedule.py",
  "src/lexinform/services/message_parts.py",
  "src/lexinform/services/publications.py",
  "src/lexinform/services/analysis.py",
]
also_copy = ["tools"]
pytest_add_cli_args = ["-n", "0", "-p", "no:cacheprovider", "-p", "tools.mutation_probe", "--maxfail=0"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_delivery_schedule.py",
  "tests/unit/test_message_parts.py",
  "tests/unit/test_posting.py",
  "tests/unit/test_publications.py",
  "tests/unit/test_analysis_batch_lifecycle.py",
  "tests/scenario/test_daily_attention.py",
  "tests/scenario/test_message_parts.py",
  "tests/scenario/test_delivery_recovery.py",
  "tests/scenario/test_batch_only.py",
  "tests/scenario/test_batch_payload_restore.py",
  "tests/scenario/test_batch_reporting.py",
  "tests/scenario/test_computation_history.py",
  "tests/scenario/test_secondary_batch_failures.py",
]
process_isolation = "forkserver"
use_setproctitle = false
timeout_constant = 2.0
timeout_multiplier = 3.0
